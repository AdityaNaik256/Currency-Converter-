<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Currency Converter</h1>
      <p class="subtitle">Live exchange rates powered by <a href="https://www.frankfurter.app/" target="_blank" rel="noopener noreferrer">Frankfurter</a></p>

      <div class="card">
        <div class="input-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            value="1"
            min="0.01"
            step="any"
            placeholder="Enter amount"
          />
        </div>

        <div class="currency-row">
          <div class="input-group">
            <label for="from-currency">From</label>
            <select id="from-currency"></select>
          </div>

          <button id="swap-btn" title="Swap currencies" aria-label="Swap currencies">
            &#8644;
          </button>

          <div class="input-group">
            <label for="to-currency">To</label>
            <select id="to-currency"></select>
          </div>
        </div>

        <button id="convert-btn">Convert</button>

        <div id="result" class="result hidden" aria-live="polite"></div>

        <div id="rate-info" class="rate-info hidden"></div>

        <div id="error" class="error hidden" role="alert"></div>

        <div id="loading" class="loading hidden">
          <span class="spinner"></span> Fetching rates&hellip;
        </div>
      </div>

      <p class="updated-note" id="updated-note"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
